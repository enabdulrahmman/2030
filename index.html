<!doctype html>
<!-- قمنا بتغيير اللغة والاتجاه ليتناسب مع الموقع العربي -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. تغيير العنوان الذي يظهر في علامة تبويب المتصفح وإخفاء Google AI Studio -->
    <title>SubHook | المتجر الرائد للاشتراكات الرقمية</title>
    
    <meta name="description" content="احصل على أفضل الاشتراكات الرقمية وتراخيص البرمجيات بأسعار تنافسية من SubHook." />

    <!-- 2. وسوم Open Graph (لإظهار الصورة والتفاصيل في واتساب، تيليجرام، فيسبوك وغيرها) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SubHook | المتجر الرائد للاشتراكات الرقمية" />
    <meta property="og:description" content="احصل على أفضل الاشتراكات الرقمية وتراخيص البرمجيات بأسعار تنافسية." />
    
    <!-- 🔴 هام جداً: استبدل هذا الرابط بالرابط المباشر للصورة التي تريد ظهورها -->
    <meta property="og:image" content="https://your-domain.com/path-to-your-preview-image.jpg" />
    <meta property="og:url" content="https://your-domain.com" />

    <!-- 3. وسوم تويتر (تفيد في حال تمت مشاركة الرابط على منصة إكس) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SubHook | المتجر الرائد للاشتراكات الرقمية" />
    <meta name="twitter:description" content="احصل على أفضل الاشتراكات الرقمية وتراخيص البرمجيات بأسعار تنافسية." />
    <meta name="twitter:image" content="https://your-domain.com/path-to-your-preview-image.jpg" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
